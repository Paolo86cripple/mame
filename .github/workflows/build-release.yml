name: Build & continuous release (Linux)

# Builds two flavours of MAME and publishes each as a rolling ("continuous")
# GitHub release that is replaced on every successful run:
#   - continuous-full    -> full MAME     (SUBTARGET=mame,   binary: mame)
#   - continuous-arcade  -> arcade only   (SUBTARGET=arcade, binary: mamearcade)
# The arcade driver set is defined in src/mame/arcade.flt.

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/build-release.yml'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'makefile'
  schedule:
    - cron: '0 3 * * 6'   # weekly rebuild (Saturday 03:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            subtarget: mame
            executable: mame
            tag: continuous-full
            title: "MAME continuous - full (Linux x86_64)"
          - name: arcade
            subtarget: arcade
            executable: mamearcade
            tag: continuous-arcade
            title: "MAME continuous - arcade only (Linux x86_64)"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev \
          libasound2-dev libxinerama-dev libxi-dev libpulse-dev zstd xz-utils

    - name: Build ${{ matrix.executable }}
      env:
        SUBTARGET: ${{ matrix.subtarget }}
        ARCHOPTS: -U_FORTIFY_SOURCE
        TOOLS: 1
        NOWERROR: 1
        PRECOMPILE: 0
      run: make -j"$(nproc)"

    - name: Smoke test
      run: ./${{ matrix.executable }} -version

    - name: Package
      id: pkg
      run: |
        set -e
        exe='${{ matrix.executable }}'
        name="${exe}-linux-x86_64-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
        mkdir -p "dist/$name"
        strip "$exe" chdman romcmp unidasm 2>/dev/null || true
        cp "$exe" chdman romcmp unidasm "dist/$name/" 2>/dev/null || cp "$exe" "dist/$name/"
        cp -r hash ini plugins language keymaps ctrlr artwork bgfx hlsl samples uismall.bdf COPYING "dist/$name/" 2>/dev/null || true
        cd dist
        XZ_OPT='-T0 -6' tar -cJf "$name.tar.xz" "$name"
        sha256sum "$name.tar.xz" > "$name.tar.xz.sha256"
        ls -lh
        echo "file=dist/$name.tar.xz" >> "$GITHUB_OUTPUT"
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pkg.outputs.name }}
        path: dist/*.tar.xz*
        if-no-files-found: error
        retention-days: 7

    - name: Publish continuous release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ matrix.tag }}
        TITLE: ${{ matrix.title }}
      run: |
        set -e
        notes=$(printf '%s\n\n%s\n%s' \
          "Automated rolling build of commit ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))." \
          "Replaced on every successful run of this workflow." \
          "Requires SDL2 at runtime. Extract the archive and run ./${{ matrix.executable }}.")
        gh release delete "$TAG" --cleanup-tag --yes || true
        gh release create "$TAG" dist/*.tar.xz dist/*.sha256 \
          --target "$GITHUB_SHA" --title "$TITLE" --notes "$notes" --latest=false
