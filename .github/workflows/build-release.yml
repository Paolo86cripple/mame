name: Build & continuous release (CachyOS pkg + AppImage)

# Builds two flavours of MAME and publishes each as a rolling ("continuous")
# GitHub release that is replaced on every successful run:
#   - continuous-full    -> full MAME     (SUBTARGET=mame,   binary: mame)
#   - continuous-arcade  -> arcade only   (SUBTARGET=arcade, binary: mamearcade)
# Each release ships:
#   - a CachyOS/Arch package (.pkg.tar.zst) optimized for AMD Zen 3 (-march=znver3)
#   - a generic x86-64 AppImage
# The arcade driver set is defined in src/mame/arcade.flt.

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/build-release.yml'
    - '.github/scripts/build-in-arch.sh'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'makefile'
  schedule:
    - cron: '0 3 * * 6'   # weekly rebuild (Saturday 03:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.flavor }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, arcade]
        variant: [znver3, generic]   # znver3 -> .pkg.tar.zst, generic -> AppImage
        include:
          - flavor: full
            subtarget: mame
            executable: mame
          - flavor: arcade
            subtarget: arcade
            executable: mamearcade
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Build and package in an Arch Linux container
      run: |
        docker run --rm \
          -e GITHUB_SHA \
          -v "$PWD:/src" \
          archlinux:latest \
          /src/.github/scripts/build-in-arch.sh \
            '${{ matrix.subtarget }}' '${{ matrix.executable }}' '${{ matrix.variant }}' "$(id -u):$(id -g)"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.flavor }}-${{ matrix.variant }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  release:
    name: Publish continuous-${{ matrix.flavor }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ matrix.flavor }}
      cancel-in-progress: false
    strategy:
      matrix:
        flavor: [full, arcade]
        include:
          - flavor: full
            title: "MAME continuous - full"
            executable: mame
          - flavor: arcade
            title: "MAME continuous - arcade only"
            executable: mamearcade
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: dist-${{ matrix.flavor }}-*
        path: dist
        merge-multiple: true

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: continuous-${{ matrix.flavor }}
        TITLE: ${{ matrix.title }}
      run: |
        set -e
        ls -lh dist
        notes=$(printf '%s\n\n%s\n%s\n%s' \
          "Automated rolling build of commit ${GITHUB_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))." \
          "Replaced on every successful run of this workflow." \
          "- ${{ matrix.executable }}-znver3-*.pkg.tar.zst: CachyOS/Arch package, optimized for AMD Zen 3 (-march=znver3). Install with: sudo pacman -U <file>" \
          "- ${{ matrix.executable }}-*.AppImage: generic x86-64 AppImage. Run with: chmod +x <file> && ./<file>")
        gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
        gh release create "$TAG" dist/* --repo "$REPO" \
          --target "$GITHUB_SHA" --title "$TITLE" --notes "$notes" --latest=false
